name: Custom Manager Cloud
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The SELinux/miuix changes are committed in this branch. Keep the historical patch
      # available for audit, but do not reapply it on top of the integrated sources.
      - name: Apply custom SELinux UI (legacy)
        if: ${{ false }}
        run: |
          echo '' | base64 -d > /tmp/selinux-ui.patch
          git apply --check /tmp/selinux-ui.patch
          git apply /tmp/selinux-ui.patch
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release manager without private signing key
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease -PKSU_PACKAGE_NAME=op.ultra.plus
      - name: Verify complete manager payload
        working-directory: manager
        run: |
          set -eu
          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libksud.so'
          test "$(unzip -p "$apk" lib/arm64-v8a/libksud.so | wc -c)" -gt 100000
      - name: Record provenance
        run: |
          git rev-parse HEAD > source-commit.txt
          sha256sum manager/app/build/outputs/apk/release/*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: KernelSU-op-ultra-plus-selinux-ui
          path: |
            manager/app/build/outputs/apk/release/*.apk
            source-commit.txt
            SHA256SUMS
          if-no-files-found: error

name: Sync successful upstream build
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: upstream-custom-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update-run-38137972875
          fetch-depth: 0
          token: ${{ secrets.KSU_SYNC_TOKEN }}
      - name: Apply reviewed patch and dispatch matched build
        env:
          GH_TOKEN: ${{ secrets.KSU_SYNC_TOKEN }}
        run: python3 .github/sync/sync.py
